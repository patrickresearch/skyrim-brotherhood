iceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The bindings suggest someone helped. Ask Torbjorn Ice-Vein at the docks. He keeps the harbor records.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1002", "Quest": "Q02", "Stage": "10", "Topic": "V2_start", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You think the killer could serve the family?", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1003", "Quest": "Q02", "Stage": "10", "Topic": "V2_start", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I'll begin with the harbor records.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1004", "Quest": "Q02", "Stage": "10", "Topic": "V2_brief", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Perhaps. First learn whose work it is. A length of rope cannot tell us whether its owner belongs with you.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1005", "Quest": "Q02", "Stage": "10", "Topic": "V2_brief", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Find the person before you decide what to make of the skill.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1006", "Quest": "Q02", "Stage": "10", "Topic": "V2_torbjorn", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "Four since the thaw. Then another came up this morning. Five now. East pier, if you mean to look.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1007", "Quest": "Q02", "Stage": "10", "Topic": "V2_torbjorn", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "All Nords. I've recorded complaints against some of those names as well as their deaths.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1008", "Quest": "Q02", "Stage": "10", "Topic": "V2_torbjorn", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "What sort of complaints?", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1009", "Quest": "Q02", "Stage": "10", "Topic": "V2_torbjorn", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Who else knows the night shifts?", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1010", "Quest": "Q02", "Stage": "10", "Topic": "V2_torbjorn", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Show me the latest body.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1011", "Quest": "Q02", "Stage": "10", "Topic": "V2_complaints", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "Dockhands beaten. Wages taken. Haldor Frost-Knuckle comes up often. He's still alive, before you ask.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1012", "Quest": "Q02", "Stage": "10", "Topic": "V2_complaints", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "A complaint doesn't prove who drowned a man. Neither does throwing the complaint away.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1013", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine", "Speaker": "DrinksTheBrine", "VoiceType": "NHV_VoiceDrinksTheBrine", "Emotion": "Neutral", "Value": "30", "Text": "You ask after dead Nords and come looking among Argonians. A short journey for a conclusion.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1014", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "(Persuade) I want a witness, not a name to give the guards.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1015", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "(Bribe) For your time. Tell me what I should examine.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1016", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Then I'll examine the body myself.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1017", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine_no", "Speaker": "DrinksTheBrine", "VoiceType": "NHV_VoiceDrinksTheBrine", "Emotion": "Neutral", "Value": "30", "Text": "You can promise that. I cannot afford to believe it. The body is still there. Look for yourself.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1018", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine_bribe", "Speaker": "DrinksTheBrine", "VoiceType": "NHV_VoiceDrinksTheBrine", "Emotion": "Neutral", "Value": "30", "Text": "For my time, then. Not another worker's name. Keep that distinction clear.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1019", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine_yes", "Speaker": "DrinksTheBrine", "VoiceType": "NHV_VoiceDrinksTheBrine", "Emotion": "Neutral", "Value": "30", "Text": "Look at the bindings. Some of us learned that hitch in the marshes. Anyone willing to learn could tie it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_010_1020", "Quest": "Q02", "Stage": "10", "Topic": "V2_brine_yes", "Speaker": "DrinksTheBrine", "VoiceType": "NHV_VoiceDrinksTheBrine", "Emotion": "Neutral", "Value": "30", "Text": "Rope has no scales, warm-blood. Remember that when you begin pointing.", "Conditions": "GetStage NHV_Q02_ColdWaters == 10", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1000", "Quest": "Q02", "Stage": "20", "Topic": "V2_body", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "The rope was still on him when we brought him up. That knot held through the tide.", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1001", "Quest": "Q02", "Stage": "20", "Topic": "V2_body", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "I've seen it on marsh fishing nets. Could be a dockhand. Could be someone who watched one work.", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1002", "Quest": "Q02", "Stage": "20", "Topic": "V2_body", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Then the knot gives us a place to watch, not a name.", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1003", "Quest": "Q02", "Stage": "20", "Topic": "V2_body", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Who saw this happen?", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1004", "Quest": "Q02", "Stage": "20", "Topic": "V2_body_witness", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "Nobody who has spoken to me. The night shift hears plenty and remembers less when the guards arrive.", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_020_1005", "Quest": "Q02", "Stage": "20", "Topic": "V2_body_witness", "Speaker": "Torbjorn", "VoiceType": "NHV_VoiceTorbjorn", "Emotion": "Neutral", "Value": "30", "Text": "Watch after the late bell. You'll find Haldor making himself useful to no one.", "Conditions": "GetStage NHV_Q02_ColdWaters == 20", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_030_1000", "Quest": "Q02", "Stage": "30", "Topic": "V2_night", "Speaker": "HaldorFrostKnuckle", "VoiceType": "NHV_VoiceHaldorFrostKnuckle", "Emotion": "Neutral", "Value": "30", "Text": "Move that crate. Or shall I show you which end of a boot gives orders?", "Conditions": "GetStage NHV_Q02_ColdWaters == 30", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_030_1001", "Quest": "Q02", "Stage": "30", "Topic": "V2_night", "Speaker": "HaldorFrostKnuckle", "VoiceType": "NHV_VoiceHaldorFrostKnuckle", "Emotion": "Neutral", "Value": "30", "Text": "What... let go! Someone's got me! Help!", "Conditions": "GetStage NHV_Q02_ColdWaters == 30", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_030_1002", "Quest": "Q02", "Stage": "30", "Topic": "V2_rescue", "Speaker": "HaldorFrostKnuckle", "VoiceType": "NHV_VoiceHaldorFrostKnuckle", "Emotion": "Neutral", "Value": "30", "Text": "Guards! Something pulled me under! What are you staring at? Go after it!", "Conditions": "GetStage NHV_Q02_ColdWaters == 30", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1000", "Quest": "Q02", "Stage": "50", "Topic": "V2_hollow", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Stop there. You have followed far enough. You are not wearing a guard's colors. Whose work brings you here?", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1001", "Quest": "Q02", "Stage": "50", "Topic": "V2_hollow", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The Dark Brotherhood. I watched you at the docks.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1099", "Quest": "Q02", "Stage": "50", "Topic": "V2_identity", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "You smell of the Void, warm-blood. Not a guard, then. Something worse.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Sings erkennt den Listener als Kind der Schatten; keine Erklärung seiner Herkunft."}, {"LineID": "NHV_Q02_050_1002", "Quest": "Q02", "Stage": "50", "Topic": "V2_identity", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Veezara's family. I have heard that name. Never met the one who carried it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1003", "Quest": "Q02", "Stage": "50", "Topic": "V2_identity", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I am Sings-Beneath-Ice. Now you have a name to put beside what you saw.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1004", "Quest": "Q02", "Stage": "50", "Topic": "V2_rescue_question", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "You pulled Haldor out. Why? He would not have reached for you.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1005", "Quest": "Q02", "Stage": "50", "Topic": "V2_rescue_question", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "His death wasn't the decision I came here to make.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1006", "Quest": "Q02", "Stage": "50", "Topic": "V2_rescue_question", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I wanted you alive and talking, not lost beneath the docks.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1007", "Quest": "Q02", "Stage": "50", "Topic": "V2_rescue_reply", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Then you have more decisions left than he does. Speak.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1008", "Quest": "Q02", "Stage": "50", "Topic": "V2_confess", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "The others? Yes. I took them to the water. Men who found it easy to hurt us when the watch looked away.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1009", "Quest": "Q02", "Stage": "50", "Topic": "V2_confess", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I remembered their hands longer than they remembered our faces.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1010", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The workers will face the guards when another body rises.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1011", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You speak of Veezara as if you knew him.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1012", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Where did you learn this work?", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1013", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "What do you want when there is no one left to punish?", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1014", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "There's a place beyond these docks. Hear what it asks first.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1015", "Quest": "Q02", "Stage": "50", "Topic": "V2_reprisal", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I know who gets questioned. I know who loses a shift while the guards ask.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1016", "Quest": "Q02", "Stage": "50", "Topic": "V2_reprisal", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I told myself fear would teach the city. Fear has been a poor teacher for me.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1017", "Quest": "Q02", "Stage": "50", "Topic": "V2_veezara", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "A name passed between people who needed to hear that an Argonian could belong somewhere.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1018", "Quest": "Q02", "Stage": "50", "Topic": "V2_veezara", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "A story is not a meeting. I would not steal his friendship merely because I wanted it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1019", "Quest": "Q02", "Stage": "50", "Topic": "V2_shadow", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I was born under the Shadow. In another life, perhaps I would have been taken young and trained as a Shadowscale.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1020", "Quest": "Q02", "Stage": "50", "Topic": "V2_shadow", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "That is not the life I lived. I learned the harbor. The rope. Which footsteps made the others go quiet.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1021", "Quest": "Q02", "Stage": "50", "Topic": "V2_purpose", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I have thought more about the next name than the morning after it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1022", "Quest": "Q02", "Stage": "50", "Topic": "V2_purpose", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "If you have something better than another name, let me hear it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1023", "Quest": "Q02", "Stage": "50", "Topic": "V2_veyra", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You found the end of the trail, Listener. May I hear what it has told you?", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1024", "Quest": "Q02", "Stage": "50", "Topic": "V2_veyra", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Another guest. My door is growing careless.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1025", "Quest": "Q02", "Stage": "50", "Topic": "V2_veyra", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Sings admits the drownings. He kills men who hurt the dockworkers.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1026", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then grievance has chosen his work for him. What of Aelius, the harbor clerk? You speak well of him, Sings.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1027", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "He paid us fairly. Used our names. Listened when the others laughed.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1028", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Would you undertake the family's work against someone you did not hate? I propose Aelius as that test.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1029", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You are proposing a man's death to test a recruit.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1030", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_plain", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Yes. I am not claiming he wronged you, or that the Mother has named him. I am asking you to weigh my proposal.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1031", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_plain", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Aelius is the man I would have kept outside my anger. You have chosen carefully.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1032", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_plain", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The Listener must still choose. So must you.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1033", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Killing him will not free Sings from every hatred.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1034", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Sings, what would make you choose this?", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1035", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I am not ready to authorize it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1036", "Quest": "Q02", "Stage": "50", "Topic": "V2_hate", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "No. One act cannot empty a lifetime. It can show whether anger is the only voice he obeys.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1037", "Quest": "Q02", "Stage": "50", "Topic": "V2_hate", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Afterward, there will still be a man to judge.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1038", "Quest": "Q02", "Stage": "50", "Topic": "V2_trial_wait", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then leave the proposal here until you can answer it. My impatience is not a command.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1039", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_choice", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I want work that does not begin with counting every insult. A family that can ask something of me besides vengeance.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1040", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_choice", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "If I accept its work, I cannot keep every kindness as an exception. I understand the price.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1041", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_choice", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I authorize the task. Your place in the family is still undecided.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1042", "Quest": "Q02", "Stage": "50", "Topic": "V2_sings_choice", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Take time. We have not agreed to this yet.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1043", "Quest": "Q02", "Stage": "50", "Topic": "V2_authorize", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Then I will go to him. Do not tell me later that I must have secretly hated him.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_050_1044", "Quest": "Q02", "Stage": "50", "Topic": "V2_authorize", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I will return to Dawnstar. Bring me the truth of what happens, not merely the answer you think I prefer.", "Conditions": "GetStage NHV_Q02_ColdWaters == 50", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1000", "Quest": "Q02", "Stage": "60", "Topic": "V2_aelius_early", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "He is dead. Whatever brought him here, it was not my choice or my hand. You have no answer to your test.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1001", "Quest": "Q02", "Stage": "60", "Topic": "V2_aelius", "Speaker": "Aelius", "VoiceType": "NHV_VoiceAelius", "Emotion": "Neutral", "Value": "30", "Text": "Sings? The shift finished some time ago. Has someone been troubling you again?", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1002", "Quest": "Q02", "Stage": "60", "Topic": "V2_aelius", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Walk with me. There is something I cannot say across a desk.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1003", "Quest": "Q02", "Stage": "60", "Topic": "V2_aelius", "Speaker": "Aelius", "VoiceType": "NHV_VoiceAelius", "Emotion": "Neutral", "Value": "30", "Text": "You're shaking. Take my cloak. We can talk without you freezing.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1004", "Quest": "Q02", "Stage": "60", "Topic": "V2_sings_kill", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "He offered me his cloak. I took it before I remembered why I had come.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1005", "Quest": "Q02", "Stage": "60", "Topic": "V2_sings_kill", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Keep walking. If I stay here, I will start finding excuses.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_060_1006", "Quest": "Q02", "Stage": "60", "Topic": "V2_player_kill", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Your hand. Not mine. Do not put that death in my account merely because I stood beside you.", "Conditions": "GetStage NHV_Q02_ColdWaters == 60", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_070_1000", "Quest": "Q02", "Stage": "70", "Topic": "V2_desk", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "His desk. I thought there might be someone to send word to.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_070_1001", "Quest": "Q02", "Stage": "70", "Topic": "V2_desk", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Why are our shifts here? Our debts? These are not pay records.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_070_1002", "Quest": "Q02", "Stage": "70", "Topic": "V2_list", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "He remembered our names. I thought that was kindness. Here they are, ready to be sent north.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fertigen CK-Conditions."}, {"LineID": "NHV_Q02_070_1003", "Quest": "Q02", "Stage": "70", "Topic": "V2_list", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "It makes me want to change the reason I went to him. I cannot. I did not know this then.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Reihenfolge, Wissen und Folgeentscheidungen in flow.json; keine fe
