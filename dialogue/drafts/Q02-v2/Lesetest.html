"VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "He killed without the old hatred carrying him. That is a beginning, not a cure.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1006", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_recruit", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Give him water, work, and names that are not targets.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1007", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_unproven", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You removed the danger. You did not answer my question about him.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1008", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_unproven", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Leave the question in his record. A family can carry uncertainty without lying about it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1009", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_release", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then he leaves with the names in his head and no room in ours. That is a choice, not a failure of memory.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1010", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_release", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The harbor may be quieter. You are not responsible for making it kind.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1011", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_dead", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "A waste. You had the right to decide, Listener. Rights do not make every result wise.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1012", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_dead", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The Drowned Pool will wait for another shadow.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1013", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_surrender", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "An interesting choice. The Jarl will call it order; the harbor may call it relief.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1014", "Quest": "Q02", "Stage": "100", "Topic": "V2_report_surrender", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You have bought a bounty with a man's silence. Keep the receipt.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1015", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_player", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Aelius kept a list of Argonian names and shifts. It was meant for the Oculatus.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1016", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_player", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "A net of whispers cast over the docks. Someone at the northern desk is hauling it in.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1017", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_recovery", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You left the desk unopened. I went back before the harbor could lose the paper.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1018", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_recovery", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Aelius kept Argonian names, shifts, debts, and absences. The seal is Penitus Oculatus.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1019", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_analysis", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "He may have meant the kindness. He also meant the list. Both can be true, and neither repairs the drowned.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1020", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_analysis", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Fragment two names a northern desk. It does not name the hand that reads it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1021", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_analysis", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Then we have a pattern, not a culprit.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1022", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_analysis", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Does this connect to the earlier dispatch?", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1023", "Quest": "Q02", "Stage": "100", "Topic": "V2_fragment_analysis", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Keep it with the ledger.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1024", "Quest": "Q02", "Stage": "100", "Topic": "V2_pattern", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The same kind of watch appears around troubled families. That is enough to be careful, not enough to name an enemy.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1025", "Quest": "Q02", "Stage": "100", "Topic": "V2_connect", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Compare the reports. A net is easier to see once two knots hold the same shape.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1026", "Quest": "Q02", "Stage": "100", "Topic": "V2_home", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "The pool is quiet. I can hear the pipes arguing with it.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1027", "Quest": "Q02", "Stage": "100", "Topic": "V2_home", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "Give me a route to walk, and names that need remembering.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1028", "Quest": "Q02", "Stage": "100", "Topic": "V2_home", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "How do you settle here?", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1029", "Quest": "Q02", "Stage": "100", "Topic": "V2_home", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Ask Babette about the water.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1030", "Quest": "Q02", "Stage": "100", "Topic": "V2_home_more", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "I am learning which footsteps mean work and which mean fear.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1031", "Quest": "Q02", "Stage": "100", "Topic": "V2_home_more", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "It is slower than hatred. That may be the point.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1032", "Quest": "Q02", "Stage": "100", "Topic": "V2_home_babette", "Speaker": "Sings", "VoiceType": "NHV_VoiceSings", "Emotion": "Neutral", "Value": "30", "Text": "She has lived long enough to make death impatient.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q02_100_1033", "Quest": "Q02", "Stage": "100", "Topic": "V2_home_babette", "Speaker": "Babette", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "And you have drowned long enough to make water jealous. We will get along.", "Conditions": "GetStage NHV_Q02_ColdWaters == 100", "Notes": "INACTIVE V2; Folgeentscheidungen und Wissen in flow.json; nicht direkt importieren."}], "books": [{"LineID": "NHV_Q02_070_3000", "Quest": "Q02", "Stage": "70", "Topic": "V2_AeliusList", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "PENITUS OCULATUS — EASTERN HARBOR\\n\\nObserve the laborers who move after the bell. Offer fair measure before asking for names. A frightened witness is a door; a grateful one is a key.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Draft-only duplicate kept out of active Books.csv; cite active NHV_SYS_BOOK_82 when replacing."}, {"LineID": "NHV_Q02_070_3001", "Quest": "Q02", "Stage": "70", "Topic": "V2_AeliusList", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Argonian workers: record shifts, debts, quarrels, and absences. Do not call this persecution. Call it prevention. Forward all patterns to the northern desk under seal.", "Conditions": "GetStage NHV_Q02_ColdWaters == 70", "Notes": "INACTIVE V2; Draft-only continuation for the existing Fragment 2 text."}, {"LineID": "NHV_SYS_BOOK_1", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "THE GLEANER'S LEDGER\\n\\nA name is not a summons. It is a question written down before anyone decides whether to ask it.", "Conditions": "", "Notes": "Buch für die Ledger Room; wird nach dem Memorial und vor Q01 übergeben."}, {"LineID": "NHV_SYS_BOOK_2", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I keep names because memory is a poor lock. It opens for grief, closes for pride, and lets the most convenient story walk out wearing the truth's face.", "Conditions": "", "Notes": "Seite 1; Veyras Arbeitsmethode."}, {"LineID": "NHV_SYS_BOOK_3", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "First mark the deed. Then mark the silence after it. A killer who can describe the blood but not the hour afterward has told you only half a story.", "Conditions": "", "Notes": "Seite 1; keine pauschale Eignungsregel."}, {"LineID": "NHV_SYS_BOOK_4", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Second: watch what remains when anger has spent itself. Remorse is not proof. Cruelty is not proof. The choice that follows is the part worth carrying to the Listener.", "Conditions": "", "Notes": "Seite 2; Listener entscheidet über Aufnahme."}, {"LineID": "NHV_SYS_BOOK_5", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Third: never mistake hunger for devotion. The Dark Brotherhood needs hands that choose the knife, and minds that know when to put it away.", "Conditions": "", "Notes": "Seite 2; Veyras Deutung, keine universelle Sithis-Lehre."}, {"LineID": "NHV_SYS_BOOK_6", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I have served Sithis in more than one house. The doors bore different names. The silence beyond them did not.", "Conditions": "", "Notes": "Seite 3; fraktionsübergreifende Tätigkeit angedeutet, keine konkrete Morag-Tong-Tatsache."}, {"LineID": "NHV_SYS_BOOK_7", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The Mother speaks to her Listener. The Listener judges those I bring to the door. I offer names not commands.", "Conditions": "", "Notes": "Seite 3; Zuständigkeiten von Night Mother, Listener und Veyra."}, {"LineID": "NHV_SYS_BOOK_8", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "When a sanctuary burns, count what can still be taught. Count the doors that remain. Count the people who have not yet learned to call themselves lost.", "Conditions": "", "Notes": "Seite 4; Veyras Wiederaufbau-Motiv."}, {"LineID": "NHV_SYS_BOOK_9", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "First inquiry: Hjaalmarch. Hrefna Stormhollow, a Nord farmer, performed the Black Sacrament against the moneylender taking her farm. No answer came.", "Conditions": "", "Notes": "Seite 5; Q01-Anker nach Hrefnas Autorenprofil; ihre Tat und das Schicksal des Geldverleihers bleiben offen."}, {"LineID": "NHV_SYS_BOOK_10", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "She waited six weeks. Her husband drank, the cupboards emptied, and grief learned the shape of work. Begin in Morthal. Ask what the marsh returned.", "Conditions": "", "Notes": "Seite 5; Q01-Anker nach Hrefnas Autorenprofil; keine vorweggenommene Mordszene."}, {"LineID": "NHV_SYS_BOOK_11", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Do not offer a place before you have heard the petitioner's story. Find the fisherman who remembers the water. Learn why the town calls the death an accident.", "Conditions": "", "Notes": "Seite 6; Hakan Reed-Walker als erster Ermittlungsanker; Veyra bleibt externe Helferin."}, {"LineID": "NHV_SYS_BOOK_12", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If this ledger outlives me, let its keeper cross out every certainty I mistook for wisdom. A record that cannot be corrected is only another kind of lie.", "Conditions": "", "Notes": "Seite 6; Mysterium und Veyras Fehlbarkeit."}, {"LineID": "NHV_SYS_BOOK_13", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "DIARY OF ASH AND DOORS\\n\\nNo date. The ash had settled before I arrived. Someone had swept a path through it, then denied having hands.", "Conditions": "", "Notes": "Eigenes Buch in der Deep Sanctuary; rätselhafter Veyra-Text ohne Datierung."}, {"LineID": "NHV_SYS_BOOK_14", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "A child asked whether I belonged to the house. I asked which house she meant. She pointed to the one behind her, though there was only sky.", "Conditions": "", "Notes": "Seite 1; keine direkte Herkunftserklärung."}, {"LineID": "NHV_SYS_BOOK_15", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I remember a voice before I remember a face. It told me that a closed door is still an answer. I have spent years deciding whether that was kindness.", "Conditions": "", "Notes": "Seite 2; Veyras Verhältnis zu Türen und Schweigen."}, {"LineID": "NHV_SYS_BOOK_16", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The candle burned blue when I lied. It burned black when I told the truth. On the third night it burned without a flame, and I stopped asking it to choose.", "Conditions": "", "Notes": "Seite 2; mystisches Bild, keine technische Regel."}, {"LineID": "NHV_SYS_BOOK_17", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I left a name beneath the floorboard. When I returned, the wood was bare and the name was waiting in my mouth. I did not write it down again.", "Conditions": "", "Notes": "Seite 3; absichtlich nicht auflösbares Rätsel."}, {"LineID": "NHV_SYS_BOOK_18", "Quest": "Q00", "Stage": "50", "Topic": "DiaryOfAshAndDoors", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If this is found, do not ask when it was written. Ask why the ink has not dried. Some answers are only dangerous because they arrive before the question.", "Conditions": "", "Notes": "Seite 3; Schluss des Tagebuchs."}, {"LineID": "NHV_SYS_BOOK_19", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "SITHIS, AS I WAS TAUGHT\\n\\nSome call him the Void. Some call him the Dread Father. Some call the name a cage built by frightened mouths.", "Conditions": "", "Notes": "Persönlicher theologischer Text; widersprüchliche Tamriel-Traditionen."}, {"LineID": "NHV_SYS_BOOK_20", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I was taught that Sithis is not the dark between things. He is the change that makes the space between them matter.", "Conditions": "", "Notes": "Seite 1; Veyras persönliche Deutung, keine objektive Kosmologie."}, {"LineID": "NHV_SYS_BOOK_21", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The Brotherhood asks for a god who listens. I learned to serve a father who does not need to answer. That difference keeps a knife from becoming a prayer.", "Conditions": "", "Notes": "Seite 2; Veyra wahrt religiöse Mehrdeutigkeit."}, {"LineID": "NHV_SYS_BOOK_22", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "When a life ends, the Void does not applaud. When a life changes, the Void does not forgive. It opens, and what enters is ours to carry.", "Conditions": "", "Notes": "Seite 2; keine Behauptung über Sithis' universellen Willen."}, {"LineID": "NHV_SYS_BOOK_23", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If you need certainty, kneel elsewhere. I have found only loyalty: a direction chosen again after every answer fails.", "Conditions": "", "Notes": "Seite 3; Veyras freiwillige Treue."}, {"LineID": "NHV_SYS_BOOK_24", "Quest": "Q00", "Stage": "50", "Topic": "NotesOnSithis", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The father in the prayer is older than the order that speaks his name. Whether that makes the order wise or merely late is a question for another page.", "Conditions": "", "Notes": "Seite 3; Trennung von Sithis und Brotherhood-Geschichte."}, {"LineID": "NHV_SYS_BOOK_25", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "THE HARVEST UNDER BLACK STARS\\n\\nThe old story says the field was empty until the first hand reached into the dark and found a seed that had never been planted.", "Conditions": "", "Notes": "Harvest-Legende; bewusst als überlieferte Geschichte markiert."}, {"LineID": "NHV_SYS_BOOK_26", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The seed became a tree, the tree became a shadow, and the shadow learned the names of those who had mistaken hunger for destiny.", "Conditions": "", "Notes": "Seite 1; Veyras Erntemotiv."}, {"LineID": "NHV_SYS_BOOK_27", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Every harvest leaves a gleaner behind. The reaper takes the fruit. The gleaner finds the fallen grain and asks whether it still remembers the field.", "Conditions": "", "Notes": "Seite 2; Herkunft des Titels Gleaner als Legende, nicht als belegte Chronik."}, {"LineID": "NHV_SYS_BOOK_28", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Some say the gleaner serves the farmer. Some say the gleaner serves the soil. The oldest version says the gleaner serves the season that comes after.", "Conditions": "", "Notes": "Seite 2; konkurrierende Deutungen."}, {"LineID": "NHV_SYS_BOOK_29", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "When the field burns, the harvest is not saved by pretending the grain is unhurt. It is saved by finding what can still take root.", "Conditions": "", "Notes": "Seite 3; Veyras Wiederaufbau-Motiv."}, {"LineID": "NHV_SYS_BOOK_30", "Quest": "Q00", "Stage": "50", "Topic": "HarvestUnderBlackStars", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The story ends before the new field rises. Every teller leaves that page blank. A full ending would only be another field with no room for us.", "Conditions": "", "Notes": "Seite 3; offenes Ende."}, {"LineID": "NHV_SYS_BOOK_31", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "FIELD NOTES: SANCTUARIES\\n\\nA sanctuary is not a room beneath a road. It is the agreement that a person may sleep while another person keeps watch.", "Conditions": "", "Notes": "Praktische Veyra-Notizen; auf mehrere Sanctuarys übertragbar."}, {"LineID": "NHV_SYS_BOOK_32", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "First sign of failure: everyone knows who is to blame. Second sign: nobody knows who is responsible. Third sign: the candles are trimmed, but no one prays.", "Conditions": "", "Notes": "Seite 1; Beobachtung statt historischer Behauptung."}, {"LineID": "NHV_SYS_BOOK_33", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Keep a table large enough for one more chair. A family that cannot make room has already begun to count itself dead.", "Conditions": "", "Notes": "Seite 2; Wiederaufbau und Zugehörigkeit."}, {"LineID": "NHV_SYS_BOOK_34", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Do not seal every passage. A hidden door is useful until it becomes the only way out. Leave one route for the living and one for the truth.", "Conditions": "", "Notes": "Seite 2; Bezug auf die Deep Sanctuary."}, {"LineID": "NHV_SYS_BOOK_35", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "When the last survivor says the family is finished, ask who taught them to count. Numbers are obedient. Rooms are not.", "Conditions": "", "Notes": "Seite 3; Veyras Skepsis gegenüber endgültigen Urteilen."}, {"LineID": "NHV_SYS_BOOK_36", "Quest": "Q00", "Stage": "50", "Topic": "SanctuaryFieldNotes", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "A keeper who never leaves the ledger becomes its prisoner. Walk the halls. Hear the doors. Let the names become faces before you decide what they owe you.", "Conditions": "", "Notes": "Seite 3; Veyras Selbstkritik."}, {"LineID": "NHV_SYS_BOOK_37", "Quest": "Q00", "Stage": "50", "Topic": "TheFivefoldSilence", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "THE FIVEFOLD SILENCE\\n\\nOne tale says a mother offered five children to the dark. Another says the tale was written by five children who needed a mother.", "Conditions": "", "Notes": "Night-Mother-Legende; widersprüchliche Überlieferung ausdrücklich erhalten."}, {"LineID": "NHV_SYS_BOOK_38", "Quest": "Q00", "Stage": "50", "Topic": "TheFivefoldSilence", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "A third tale says there were no children at all, only five names spoken over a bowl of ash. The bowl was real. That is the only part every teller keeps.", "Conditions": "", "Notes": "Seite 1; keine Festlegung auf eine genealogische Wahrheit."}, {"LineID": "NHV_SYS_BOOK_39", "Quest": "Q00", "Stage": "50", "Topic": "TheFivefoldSilence", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Years later, a voice called one listener from the dark. The others heard nothing. They built an order around the silence and called it proof.", "Conditions": "", "Notes": "Seite 2; Night-Mother-/Listener-Tradition."}, {"LineID": "NHV_SYS_BOOK_40", "Quest": "Q00", "Stage": "50", "Topic": "TheFivefoldSilence", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If the mother was a woman, the title remembers her. If the mother was a story, the title remembers us. Both can be true until someone mistakes memory for a witness.", "Conditions": "", "Notes": "Seite 2; Lore-Mehrdeutigkeit."}, {"LineID": "NHV_SYS_BOOK_41", "Quest": "Q00", "Stage": "50", "Topic": "TheFivefoldSilence", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Keep the names if you must. Keep the doubt as well. A family built on one unquestioned story will eventually sacrifice its living to protect the dead.", "Conditions": "", "Notes": "Seite 3; Verbindung zu Veyras Grundsätzen."}, {"LineID": "NHV_SYS_BOOK_42", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaFarmLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "HREFNA STORMHOLLOW'S FARM LEDGER\\n\\nSpring: two sacks of barley lost to rain. One axle split. Eirik says the debt has grown teeth.", "Conditions": "", "Notes": "Fundort Q01 Stage 20; Hrefnas alter Hof; keine Questlogik."}, {"LineID": "NHV_SYS_BOOK_43", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaFarmLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Summer: the north field held. My husband did not. He drinks before noon and calls it courage when I ask him to stop.", "Conditions": "", "Notes": "Seite 1; Hrefnas Ehemann und die finanzielle Belastung."}, {"LineID": "NHV_SYS_BOOK_44", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaFarmLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Autumn: Eirik marked the west field with red chalk. He says a mark is not a sentence. He has never had to live beneath one.", "Conditions": "", "Notes": "Seite 2; Eiriks Pfändungsdrohung wird angedeutet."}, {"LineID": "NHV_SYS_BOOK_45", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaFarmLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Winter: I counted the flour twice. I counted the arrows three times. I did not count the days until I began to fear the answer.", "Conditions": "", "Notes": "Seite 2; Hrefnas praktische, schuldgeprägte Stimme."}, {"LineID": "NHV_SYS_BOOK_46", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaUnsentLetter", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "UNSENT LETTER\\n\\nTo the Mother in the dark: Eirik Ashmark is taking the farm, the animals, and whatever is left of my husband's name. I ask for an answer.", "Conditions": "", "Notes": "Fundort Q01 Stage 20; Hrefnas Black Sacrament wird als Bitte, nicht als Lösung dargestellt."}, {"LineID": "NHV_SYS_BOOK_47", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaUnsentLetter", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I have followed the words as they were given. Heart, skull, flesh, bones, nightshade. I do not know whether the order matters. I only know that I did it alone.", "Conditions": "", "Notes": "Seite 1; Ritualdetails ohne neue Lorebehauptung."}, {"LineID": "NHV_SYS_BOOK_48", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaUnsentLetter", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If someone comes, let them come before the roof goes. If no one comes, let the dark at least remember that I asked.", "Conditions": "", "Notes": "Seite 2; Night Mother bleibt im Hintergrund und antwortet nicht sichtbar."}, {"LineID": "NHV_SYS_BOOK_49", "Quest": "Q01", "Stage": "20", "Topic": "HrefnaUnsentLetter", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I cannot keep waiting. The flour is nearly gone. If no one comes, I will have to do something myself.", "Conditions": "", "Notes": "Seite 2; leitet Hrefnas spätere eigene Entscheidung ein."}, {"LineID": "NHV_SYS_BOOK_50", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaMoorJournal", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "NOTES FROM THE MOOR\\n\\nDay seven: no answer. Eirik sent another boy to measure the fence. The boy would not meet my eyes.", "Conditions": "", "Notes": "Fundort Q01 Stage 30; nach der ersten Untersuchung des Hofs."}, {"LineID": "NHV_SYS_BOOK_51", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaMoorJournal", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Day twenty-one: my husband drank through the morning and slept through the rain. I put the knife away. Then I put it somewhere else.", "Conditions": "", "Notes": "Seite 1; Hrefnas Schwanken zwischen Handlung und Zurückhaltung."}, {"LineID": "NHV_SYS_BOOK_52", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaMoorJournal", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Day forty-two: the answer did not come. I found Eirik at the waterline, laughing at the deed in his hand. I asked him to give it back.", "Conditions": "", "Notes": "Seite 2; unmittelbare Vorgeschichte des Mordes, aber kein vollständiger Ablauf."}, {"LineID": "NHV_SYS_BOOK_53", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaMoorJournal", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "He said the farm was already his. I keep writing that he slipped. I keep crossing it out.", "Conditions": "", "Notes": "Seite 2; starker Verdacht statt vorgezogenem Geständnis; Hrefnas persönliche Einordnung bleibt Stage 40."}, {"LineID": "NHV_SYS_BOOK_54", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaMoorJournal", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I washed the cup. Scrubbed the table. There is always something that needs cleaning. It helps until I stop.", "Conditions": "", "Notes": "Seite 3; Schuld, Trauer und die Beziehung bleiben offen."}, {"LineID": "NHV_SYS_BOOK_55", "Quest": "Q01", "Stage": "20", "Topic": "EirikDemandNotice", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "NOTICE OF DEBT\\n\\nTo Hrefna Stormhollow: payment is overdue. The west field, livestock, tools, and dwelling are collateral against the outstanding sum.", "Conditions": "", "Notes": "Fundort Q01 Stage 20; Eiriks Forderungsschreiben."}, {"LineID": "NHV_SYS_BOOK_56", "Quest": "Q01", "Stage": "20", "Topic": "EirikDemandNotice", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You have been granted one final extension. Do not mistake patience for mercy. The mark will be made public when the next moon turns.", "Conditions": "", "Notes": "Seite 1; Eiriks Macht über den Hof."}, {"LineID": "NHV_SYS_BOOK_57", "Quest": "Q01", "Stage": "20", "Topic": "EirikDemandNotice", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Bring the keys to my office in Morthal. Bring your husband if he can stand. Bring no priest, no guard, and no story about bad harvests.", "Conditions": "", "Notes": "Seite 1; Drohung ohne neue Nebenfigurgeschichte."}, {"LineID": "NHV_SYS_BOOK_58", "Quest": "Q01", "Stage": "20", "Topic": "EirikDemandNotice", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Eirik Ashmark. This notice will be retained with the account.", "Conditions": "", "Notes": "Seite 2; Abschluss des Forderungsschreibens; gemeinsam mit 055–057 in Stage 20."}, {"LineID": "NHV_SYS_BOOK_59", "Quest": "Q01", "Stage": "60", "Topic": "QuintusFieldNote", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "FIELD NOTE – HJAALMARCH\\n\\nLocals call Ashmark's death an accident. No witness will speak plainly.", "Conditions": "", "Notes": "Fundort Q01 Stage 60; Quintus' Unterlagen."}, {"LineID": "NHV_SYS_BOOK_60", "Quest": "Q01", "Stage": "60", "Topic": "QuintusFieldNote", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Hrefna Stormhollow: Nord farmer. Farm seized for debt. Husband reportedly drinking heavily. Defensive when questioned. Do not approach her without a second route out.", "Conditions": "", "Notes": "Seite 1; Quintus beobachtet Hrefna, versteht sie aber nur teilweise."}, {"LineID": "NHV_SYS_BOOK_61", "Quest": "Q01", "Stage": "60", "Topic": "QuintusFieldNote", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Ritual remains indicate a deliberate petition. No Brotherhood contact confirmed. Watch the farm and question anyone asking after Ashmark.", "Conditions": "", "Notes": "Seite 2; Quintus bleibt bei beobachtbaren Hinweisen und offenen Ermittlungsfragen."}, {"LineID": "NHV_SYS_BOOK_62", "Quest": "Q01", "Stage": "60", "Topic": "QuintusFieldNote", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If the woman killed Ashmark, she may be useful to the Brotherhood. If she did not, someone else is using the marsh to hide a better story.", "Conditions": "", "Notes": "Seite 2; Quintus ist Ermittler, kein allwissender Erzähler."}, {"LineID": "NHV_SYS_BOOK_63", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "LEDGER ENTRY: HREFNA STORMHOLLOW\\n\\nCandidate: Nord woman, farmer, Hjaalmarch. Last known home: a small holding outside Morthal. Begin there if the townspeople cannot tell you where she went.", "Conditions": "", "Notes": "Erweiterte Q01-Ledgerfassung; Profil- und Ermittlungsdaten, kein neues Questziel."}, {"LineID": "NHV_SYS_BOOK_64", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "When I first watched the farm, it was being emptied. Barley, tools, animals, and finally the right to stand beneath one's own roof had been measured against a debt.", "Conditions": "", "Notes": "Hjaalmarch-Eintrag; Eiriks Pfändungsdruck als frühere Beobachtung."}, {"LineID": "NHV_SYS_BOOK_65", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Creditor: Eirik Ashmark. Moneylender, Morthal. His notices use patience as a threat and legality as a locked door. He prefers witnesses who need wages.", "Conditions": "", "Notes": "Eirik-Profil; keine zusätzliche Oculatus-Verbindung vor Q01."}, {"LineID": "NHV_SYS_BOOK_66", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Household condition: husband drinking heavily, courage performed loudly before noon. Hrefna counts flour, arrows, and unpaid days. She does not count her own exhaustion until it becomes a weapon.", "Conditions": "", "Notes": "Hrefna-Profil; Beobachtung ihrer Schuld- und Versorgungslogik."}, {"LineID": "NHV_SYS_BOOK_67", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "She performed the Black Sacrament. No answer came. Whatever failed between her prayer and our arrival, she was left to bear the waiting.", "Conditions": "", "Notes": "Sithis/Night-Mother-Lore bleibt mehrdeutig; keine Behauptung über göttliche Ablehnung."}, {"LineID": "NHV_SYS_BOOK_68", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Six weeks is long enough for hope to become a chore. It is also long enough for a person to mistake endurance for permission. Ask what she did with the time.", "Conditions": "", "Notes": "Q01-Untersuchungsfrage; keine vorweggenommene Tatbeschreibung."}, {"LineID": "NHV_SYS_BOOK_69", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "The marsh keeps records without ink. Footprints fill. Water carries weight. A town chooses the word accident when the truth would require a name.", "Conditions": "", "Notes": "Moor- und Morthal-Motiv; führt zur Untersuchung des Todesfalls."}, {"LineID": "NHV_SYS_BOOK_70", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Find Hakan Reed-Walker first. He knows the marsh. Ask what he noticed, and what made him decide to keep it to himself.", "Conditions": "", "Notes": "Q01-Ermittlungsanker; Hakan als Nebenfigur aus dem Autorenprofil."}, {"LineID": "NHV_SYS_BOOK_71", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Search the farm before you seek Hrefna. When you find her, begin with what she lost, not what you suspect.", "Conditions": "", "Notes": "Gesprächsführung für Q01; Hrefnas Perspektive vor der Prüfung."}, {"LineID": "NHV_SYS_BOOK_72", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If she killed Ashmark, the act may have begun in grief and continued by choice. If she did not, grief has still taught her how to hide a wound.", "Conditions": "", "Notes": "Veyras offene Hypothese; keine vorweggenommene Auflösung."}, {"LineID": "NHV_SYS_BOOK_73", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "If she killed him, ask whether she could choose the work without that first grievance. Another death alone would tell us little.", "Conditions": "", "Notes": "Q01-Prüfungskriterium; knüpft an Hrefnas Schwäche und die E23-Arbeitsweise an."}, {"LineID": "NHV_SYS_BOOK_74", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Do not mistake a full account for a true one. Let Hrefna contradict this page. I recorded what I observed, not everything she is.", "Conditions": "", "Notes": "Veyras Fehlbarkeit; der Listener soll selbst urteilen."}, {"LineID": "NHV_SYS_BOOK_75", "Quest": "Q00", "Stage": "60", "Topic": "TheGleanersLedger", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Record after the meeting: listen for the moment she stops speaking about what happened and begins speaking about what she chose. That is where the recruit begins.", "Conditions": "", "Notes": "Notiz für die spätere Q01-Auswertung; keine automatische Entscheidung."}, {"LineID": "NHV_SYS_BOOK_76", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "FESTUS KREX\\n\\nA sharp tongue, a practiced hand. His place at the table remains.", "Conditions": "", "Notes": "Activator Record NHV_Act_Q00_PlaqueFestus (003DA1); Name: Festus Krex. Epitaph für spätere Lesefunktion."}, {"LineID": "NHV_SYS_BOOK_77", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "GABRIELLA\\n\\nA measured voice, a practiced blade. The family remembers both.", "Conditions": "", "Notes": "Activator Record NHV_Act_Q00_PlaqueGabriella (003DA2); Name: Gabriella. Epitaph für spätere Lesefunktion."}, {"LineID": "NHV_SYS_BOOK_78", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "ARNBJORN\\n\\nThe beast served the family. The man beside it was family too.", "Conditions": "", "Notes": "Activator Record NHV_Act_Q00_PlaqueArnbjorn (003DA3); Name: Arnbjorn. Epitaph für spätere Lesefunktion."}, {"LineID": "NHV_SYS_BOOK_79", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "VEEZARA\\n\\nA hidden blade, a measured breath. His enemies learned too late where the dark began.", "Conditions": "", "Notes": "Activator Record NHV_Act_Q00_PlaqueVeezara (003DA4); Name: Veezara. Epitaph für spätere Lesefunktion."}, {"LineID": "NHV_SYS_BOOK_80", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "ASTRID\\n\\nShe led this family. Her failures do not erase her name.", "Conditions": "NHV_AstridMemorial == 1", "Notes": "Activator Record NHV_Act_Q00_PlaqueAstrid (003DA5); Name: Astrid. Wahl 1, große Plakette bei den anderen."}, {"LineID": "NHV_SYS_BOOK_81", "Quest": "Q00", "Stage": "60", "Topic": "MemorialPlaques", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "ASTRID\\n\\nRemembered, but not honored. Her name remains where the family can see it.", "Conditions": "NHV_AstridMemorial == 3", "Notes": "Kein eigener Activator-Record; verwendet NHV_Act_Q00_PlaqueAstrid (003DA5). Wahl 3, kleine Plakette darunter; abweichender Text für spätere Lesefunktion."}, {"LineID": "NHV_SYS_BOOK_82", "Quest": "Q02", "Stage": "70", "Topic": "OculatusDispatch02", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "PENITUS OCULATUS — EASTERN HARBOR\\n\\nObserve the laborers who move after the bell. Offer fair measure before asking for names. A frightened witness is a door; a grateful one is a key.\\n\\nArgonian workers: record shifts, debts, quarrels, and absences. Do not call this persecution. Call it prevention. Forward all patterns to the northern desk under seal.", "Conditions": "", "Notes": "Oculatus-Fragment 2; liegt bei Aelius. Der Text bestätigt das Informantennetz, ohne Aelius' Freundlichkeit als vollständig gespielt zu entwerten."}, {"LineID": "NHV_SYS_BOOK_83", "Quest": "Q02", "Stage": "10", "Topic": "ReedWalkersKnot", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "REED-WALKER'S KNOT\\n\\nFlat hitch. Marsh cord. It holds when wet and loosens when the hand remembers where to pull.", "Conditions": "", "Notes": "Lesetext für NHV_MISC_ReedWalkersKnot; optionales Beweisstück, kein Questfortschritt allein."}, {"LineID": "NHV_SYS_BOOK_84", "Quest": "Q02", "Stage": "100", "Topic": "DrownedPoolInscription", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "THE DROWNED POOL\\n\\nBreathe before you enter. Leave no name to the water that you are unwilling to carry back out.", "Conditions": "", "Notes": "Kurze Inschrift für NHV_Act_DrownedPoolNameBowl; Raum-Lore nach erfolgreicher Rekrutierung."}, {"LineID": "NHV_SYS_BOOK_85", "Quest": "Q01", "Stage": "60", "Topic": "OculatusDispatch01", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "PENITUS OCULATUS — HJAALMARCH\\n\\nSubject: repeated Black Sacrament activity. Record the petitioner, the named target, the local witness, and any surviving household. Do not intervene before the pattern is confirmed.\\n\\nForward copies to the northern desk. A prayer unanswered is still a signal.", "Conditions": "", "Notes": "Oculatus-Fragment 1; Quintus' dispatch, im Besitz des Spielers nach dem Fund."}, {"LineID": "NHV_SYS_BOOK_86", "Quest": "Q01", "Stage": "30", "Topic": "HrefnaDiaryExcerpt", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "HREFNA'S DIARY — SIXTH WEEK\\n\\nThe wick burned out before the answer came. I lit another. I wrote the words again. The page stayed dry.\\n\\nTomorrow I go to the bog. I will ask him once. Then I will stop asking.", "Conditions": "", "Notes": "Optionaler Tagebuchauszug; verdichtet Hrefnas Warten, ohne Eiriks Tod direkt zu erklären."}, {"LineID": "NHV_SYS_BOOK_87", "Quest": "Q01", "Stage": "100", "Topic": "BogwifesKnife", "Speaker": "Book", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "BOGWIFE'S KNIFE\\n\\nA narrow blade, blackened at the spine and bright at the edge. It was made for roots, reeds, and work that must be finished quietly.", "Conditions": "", "Notes": "Flavortext für NHV_Weap_BogwifesKnife; Q01-Recruit-Belohnung."}]}</script><script>const d=JSON.parse(document.getElementById("data").textContent),g=Object.fromEntries(d.flow.nodes.map(n=>[n.id,n])),r=Object.fromEntries(d.rows.map(x=>[x.LineID,x])),b=Object.fromEntries(d.books.map(x=>[x.LineID,x]));let s={...d.flow.initial,persuade:true,bribe:true},cur=d.flow.start;function ok(x){return Object.entries(x||{}).every(([k,v])=>s[k]===v)}function enter(id){let n=g[id];if(!ok(n.when))return enter(n.otherwise);s={...s,...n.effects};cur=id;render()}function render(){let n=g[cur],m=document.getElementById("main"),c=document.getElementById("choices");m.innerHTML=`<small>Stage ${n.stage} · ${cur}</small><h2>${n.title}</h2>`+(n.direction?`<p>${n.direction}</p>`:"")+n.lines.map(k=>`<div class="speech"><div class="speaker">${r[k].Speaker}</div><div>${r[k].Text}</div></div>`).join("")+(n.bookLines||[]).map(k=>b[k]?`<pre>${b[k].Text.replaceAll("\\n","\n")}</pre>`:"").join("");c.innerHTML="";(n.choices||[]).filter(x=>ok(x.requires)).forEach(x=>{let q=document.createElement("button");q.textContent=x.line?r[x.line].Text:"World event: "+x.ui;q.onclick=()=>enter(x.to);c.append(q)});if(n.next){let q=document.createElement("button");q.textContent="Continue";q.onclick=()=>enter(n.next);c.append(q)}if(n.terminal)m.innerHTML+="<p>Test complete.</p>"}enter(cur)</script>
