: "V2_record", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "Nirelda Aurantil was expelled eleven years ago. Her rival died during a destructive experiment.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1018", "Quest": "Q03", "Stage": "10", "Topic": "V2_record", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "The statements disagree about intent. The College filed the uncertainty and called it closure.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1019", "Quest": "Q03", "Stage": "10", "Topic": "V2_record", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "What does the file say about her tower?", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1020", "Quest": "Q03", "Stage": "10", "Topic": "V2_record", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Who else saw the accident?", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1021", "Quest": "Q03", "Stage": "10", "Topic": "V2_record", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I'll take the uncertainty with me.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1022", "Quest": "Q03", "Stage": "10", "Topic": "V2_record_tower", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "Hollowfrost Spire. A private tower on the tundra. The College has no claim there now.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1023", "Quest": "Q03", "Stage": "10", "Topic": "V2_record_tower", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "If she is still alive, she may prefer the cold to another hearing.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1024", "Quest": "Q03", "Stage": "10", "Topic": "V2_record_witness", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "Students, a master, and one apprentice who changed her account twice.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_010_1025", "Quest": "Q03", "Stage": "10", "Topic": "V2_record_witness", "Speaker": "Urag", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "No sentence in that file tells you what happened inside her head.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 10", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1000", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow", "Speaker": "Thyra", "VoiceType": "NHV_VoiceThyra", "Emotion": "Neutral", "Value": "30", "Text": "My Brandr took the south road to Dawnstar. His horse came home. He did not.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1001", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow", "Speaker": "Thyra", "VoiceType": "NHV_VoiceThyra", "Emotion": "Neutral", "Value": "30", "Text": "Some nights there is a light on the tundra. Hollowfrost Spire, they call it. Nobody honest lives there.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1002", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Did Brandr ever meet Nirelda?", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1003", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I'll find the tower.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1004", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow_nirelda", "Speaker": "Thyra", "VoiceType": "NHV_VoiceThyra", "Emotion": "Neutral", "Value": "30", "Text": "He said a woman asked about the color of his blood. He thought she was a healer until she stopped listening.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1005", "Quest": "Q03", "Stage": "20", "Topic": "V2_widow_nirelda", "Speaker": "Thyra", "VoiceType": "NHV_VoiceThyra", "Emotion": "Neutral", "Value": "30", "Text": "That is all I know. Do not turn my grief into a story that makes you brave.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_020_1006", "Quest": "Q03", "Stage": "20", "Topic": "V2_tower", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The record and the widow point to one place. Hollowfrost Spire is not a verdict. It is where your questions become dangerous.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 20", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1000", "Quest": "Q03", "Stage": "30", "Topic": "V2_defenses", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "Frost. Poison. Blade. Silence. Four ways for a body to stop arguing with the world.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1001", "Quest": "Q03", "Stage": "30", "Topic": "V2_defenses", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "You may solve the order, or show me what you do when a door refuses to open.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1002", "Quest": "Q03", "Stage": "30", "Topic": "V2_defenses", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Use the notes to set the four pillars.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1003", "Quest": "Q03", "Stage": "30", "Topic": "V2_defenses", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Force the mechanism with fire.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1004", "Quest": "Q03", "Stage": "30", "Topic": "V2_defenses", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Disarm the runes by hand.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1005", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_notes", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "You read before touching. A modest virtue. The order is frost, venom, blade, silence.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1006", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_notes", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "The door opens. Do not mistake comprehension for permission.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1007", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_force", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "A destructive solution. Efficient, loud, and careless with the structure.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1008", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_force", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "The order was written in the margins. You could have read it.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1009", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_careful", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "You disarm the runes one pin at a time. Patience is a form of knowledge, I suppose.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_030_1010", "Quest": "Q03", "Stage": "30", "Topic": "V2_pillars_careful", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "The tower admits you. I will adjust my notes.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 30", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_040_1000", "Quest": "Q03", "Stage": "40", "Topic": "V2_observation", "Speaker": "Joric", "VoiceType": "NHV_VoiceJoric", "Emotion": "Neutral", "Value": "30", "Text": "Help me... please...", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 40", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_040_1001", "Quest": "Q03", "Stage": "40", "Topic": "V2_observation", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "Do not touch him. He is almost finished. I need the exact moment.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 40", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_040_1002", "Quest": "Q03", "Stage": "40", "Topic": "V2_observation", "Speaker": "Nirelda", "VoiceType": "NHV_VoiceNirelda", "Emotion": "Neutral", "Value": "30", "Text": "You have entered my tower. Now you are another variable.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 40", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht direkt importieren."}, {"LineID": "NHV_Q03_040_1003", "Quest": "Q03", "Stage": "40", "Topic": "V2_observation", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Heal the traveler.", "Conditions": "GetStage NHV_Q03_TheScholarsSin == 40", "Notes": "INACTIVE V2; Reihenfolge und Wissen in flow.json; nicht d
