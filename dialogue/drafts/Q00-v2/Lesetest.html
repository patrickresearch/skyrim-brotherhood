age NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. "}, {"LineID": "NHV_Q00_010_1049", "Quest": "Q00", "Stage": "10", "Topic": "V2_harvest_plain", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Which is why I bring you possibilities. The choice remains yours, Listener.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. "}, {"LineID": "NHV_Q00_010_1007", "Quest": "Q00", "Stage": "10", "Topic": "V2_standoff_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You speak as though you've done this before.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Auswahl standoff_hub -> gleaner; Gates in flow.json; keine implementierten CK-Conditions."}, {"LineID": "NHV_Q00_010_1008", "Quest": "Q00", "Stage": "10", "Topic": "V2_standoff_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Knowing the answer to the door proves very little.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Auswahl standoff_hub -> door; Gates in flow.json; keine implementierten CK-Conditions."}, {"LineID": "NHV_Q00_010_1009", "Quest": "Q00", "Stage": "10", "Topic": "V2_standoff_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You arrive after Falkreath burns. Convenient.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Auswahl standoff_hub -> late; Gates in flow.json; keine implementierten CK-Conditions."}, {"LineID": "NHV_Q00_010_1010", "Quest": "Q00", "Stage": "10", "Topic": "V2_standoff_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Has the Night Mother spoken to you?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Aus  "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten gleaner; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1016", "Quest": "Q00", "Stage": "10", "Topic": "V2_gleaner", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I watch them before I offer their names. Some never make it onto the page.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten gleaner; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1017", "Quest": "Q00", "Stage": "10", "Topic": "V2_gleaner", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "So every murderer is a possible recruit?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Auswahl gleaner -> murderers; Gates in flow.json; keine implementierten CK-Conditions."}, {"LineID": "NHV_Q00_010_1018", "Quest": "Q00", "Stage": "10", "Topic": "V2_gleaner", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I've heard enough about your work. For now.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Auswahl gleaner -> standoff_hub; Gates in flow.json; keine implementierten CK-Conditions."}, {"LineID": "NHV_Q00_010_1019", "Quest": "Q00", "Stage": "10", "Topic": "V2_murderers", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "A murder tells me where to look. It does not tell me whom to trust.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten murderers; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1020", "Quest": "Q00", "Stage": "10", "Topic": "V2_murderers", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Someone who needs a new enemy every morning will eventually find one at your table.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten murderers; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1021", "Quest": "Q00", "Stage": "10", "Topic": "V2_door", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "It proves I was trusted with an answer. Nothing more. The invitation must come from you.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten door; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1022", "Quest": "Q00", "Stage": "10", "Topic": "V2_door", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "You might have tried asking before walking in.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten door; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1023", "Quest": "Q00", "Stage": "10", "Topic": "V2_door", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You would have had a quieter evening. I suspect I would still be outside.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten door; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1024", "Quest": "Q00", "Stage": "10", "Topic": "V2_late", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Sad", "Value": "35", "Text": "I found ashes. Coming sooner is a comfort I cannot offer the dead.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten late; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1025", "Quest": "Q00", "Stage": "10", "Topic": "V2_late", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I can offer the living something useful. Names. People worth finding before someone else finds them.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten late; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1026", "Quest": "Q00", "Stage": "10", "Topic": "V2_late", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "Useful is a promising start. It isn't an answer to everything.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten late; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1027", "Quest": "Q00", "Stage": "10", "Topic": "V2_late", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "No. You should distrust anyone who brings one of those.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten late; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1028", "Quest": "Q00", "Stage": "10", "Topic": "V2_mother_past", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I have spoken with the Mother in a way you would not yet understand.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten mother_past; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1029", "Quest": "Q00", "Stage": "10", "Topic": "V2_mother_past", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Her words to the Brotherhood are yours to hear, Listener. I have come with an offer, not a message.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten mother_past; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1030", "Quest": "Q00", "Stage": "10", "Topic": "V2_mother_past", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Then you won't Q00_010_1035", "Quest": "Q00", "Stage": "10", "Topic": "V2_dismiss", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then I will wait at the Windpeak Inn. If you want me back, you know where to look.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten dismiss; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1036", "Quest": "Q00", "Stage": "10", "Topic": "V2_departure", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Ask her whether my work is welcome. I will wait at the Windpeak Inn.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten departure; Reihenfolge und zusaetzliche Bedingungen: flow.json. "}, {"LineID": "NHV_Q00_010_1037", "Quest": "Q00", "Stage": "10", "Topic": "V2_departure_reason", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "Then ask her. Knowing the answer to a door does not earn this woman's place behind it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten departure_reason; Reihenfolge und zusaetzliche Bedingungen: flow.json. Erst nach letzter Response Stage 15; keine Frage davor löst den Abschied aus."}, {"LineID": "NHV_Q00_010_1038", "Quest": "Q00", "Stage": "10", "Topic": "V2_departure_reason", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I will leave you to it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 10", "Notes": "INACTIVE V2; Knoten departure_reason; Reihenfolge und zusaetzliche Bedingungen: flow.json. Erst nach letzter Response Stage 15; keine Frage davor löst den Abschied aus."}, {"LineID": "NHV_Q00_012_1000", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_departure", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then ask the Mother. Before I leave, let someone this family knows speak for me.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Abschluss aus Night-Mother-Urteil; Ruf verpflichtend."}, {"LineID": "NHV_Q00_012_1001", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_departure", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I will call him now. Judge the witness as you judge me.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; keine Ablehnungswahl."}, {"LineID": "NHV_Q00_012_1002", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_blade", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "If Nazir's blade is your answer, let a witness speak before it falls.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Abschluss aus Drohung; Veyra bleibt trotzig."}, {"LineID": "NHV_Q00_012_1003", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_blade", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Someone who knew my service can answer. I will call him, even if you would rather see me go.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; keine Zustimmung der Sanctuary vorausgesetzt."}, {"LineID": "NHV_Q00_012_1004", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_dismiss", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You would send me away before deciding what I am. Very well.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Abschluss aus Verweisung; Trotz statt Einverständnis."}, {"LineID": "NHV_Q00_012_1005", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_dismiss", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Let a witness speak before I go. Then you can judge what follows.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; keine Ablehnungswahl."}, {"LineID": "NHV_Q00_012_1006", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_common", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Someone in this family's memory can speak for me. I will call him now.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; gemeinsamer Rufblock."}, {"LineID": "NHV_Q00_012_1007", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_call_common", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Lucien Lachance. If you still answer Sithis, come and speak.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Name fällt erst im verpflichtenden Ruf."}, {"LineID": "NHV_Q00_012_1008", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_arrival", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Happy", "Value": "20", "Text": "A summons in a sanctuary. Veyra, you do cultivate unusual meetings.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Ankunft nach dem Ruf; keine frühere Vanilla-Beschwörung vorausgesetzt."}, {"LineID": "NHV_Q00_012_1009", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_arrival", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "35", "Text": "Lucien Lachance, Listener. I served this family as a Speaker. What would you ask?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Ankunft und Selbstvorstellung."}, {"LineID": "NHV_Q00_012_1010", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_vouch", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "35", "Text": "I knew Veyra in Cheydinhal, when I still had a pulse. She came as a visitor, never as one of my assassins.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; E35-Bekanntschaft; E23 bleibt verborgen."}, {"LineID": "NHV_Q00_012_1011", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_vouch", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "50", "Text": "She serves Sithis willingly. I have never known her to turn from that purpose.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Bürgschaft für freiwillige Treue."}, {"LineID": "NHV_Q00_012_1012", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_vouch", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "A witness is not a pardon. But it is more than a stranger's word.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; kurze Reaktion nach der Bürgschaft."}, {"LineID": "NHV_Q00_012_1013", "Quest": "Q00", "Stage": "12", "Topic": "V2_lucien_departure", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "When the family calls again, I will answer. Until then, judge her by what she does.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 12", "Notes": "INACTIVE V2 E41; Abgang vor dem Auflösen; Deep Sanctuary nicht verraten."}, {"LineID": "NHV_Q00_015_1000", "Quest": "Q00", "Stage": "15", "Topic": "V2_exit", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Give me a moment to get past Nazir. He has made a rather thorough doorway.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 15", "Notes": "INACTIVE V2; Knoten exit; Reihenfolge und zusaetzliche Bedingungen: flow.json. Räumlicher Übergang: sichtbarer Abschied, dann Windpeak; Vorschau simuliert den vorhandenen Stage-15/20-Ablauf."}, {"LineID": "NHV_Q00_020_1000", "Quest": "Q00", "Stage": "20", "Topic": "V2_inn_early", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Back already? I would rather h Door == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> astrid_warning; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1033", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "What happens if a candidate refuses?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> refusal; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1034", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "We already have initiates. What do they lack?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> initiates; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1035", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Why did you leave Cheydinhal?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> cheydinhal; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1036", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Where would we put these new members?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> space; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1037", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "We'll recruit carefully. I'll judge each candidate myself.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> accept; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1038", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I'm not ready to bring strangers into this family.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Auswahl proposal_hub -> proposal_wait; Gates in flow.json."}, {"LineID": "NHV_Q00_030_1039", "Quest": "Q00", "Stage": "30", "Topic": "V2_motive", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "My Dread Father has not lacked for deaths. Your Brotherhood lacks people to carry on its work.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten motive; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1040", "Quest": "Q00", "Stage": "30", "Topic": "V2_motive", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I offer my service to the Mother. I am not asking to join your Brotherhood.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten motive; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1041", "Quest": "Q00", "Stage": "30", "Topic": "V2_motive", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Happy", "Value": "15", "Text": "If you accept, I will stay and keep the ledger. You will have ample time to regret my handwriting.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten motive; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1042", "Quest": "Q00", "Stage": "30", "Topic": "V2_trust", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Agreed. Anyone can learn the words. Watch what remains when speaking them costs something.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten trust; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1043", "Quest": "Q00", "Stage": "30", "Topic": "V2_trust", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "A person may begin with hatred. What matters is whether they can serve anything beyond it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten trust; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1044", "Quest": "Q00", "Stage": "30", "Topic": "V2_trust", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "And if they can't, we find out before they learn where we sleep.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten trust; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1045", "Quest": "Q00", "Stage": "30", "Topic": "V2_astrid_warning", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "No test promises that. Astrid had a family. She still chose to betray it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten astrid_warning; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1046", "Quest": "Q00", "Stage": "30", "Topic": "V2_astrid_warning", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "We keep watching after the invitation. So should you.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten astrid_warning; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1047", "Quest": "Q00", "Stage": "30", "Topic": "V2_astrid_warning", "Speaker": "Babette", "VoiceType": "Vanilla", "Emotion": "Anger", "Value": "25", "Text": "And this time, if someone starts making private arrangements for our safety, we ask whose throat pays for them.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten astrid_warning; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1048", "Quest": "Q00", "Stage": "30", "Topic": "V2_refusal", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then there is no recruit. Refusing an invitation is not the same as betraying the family.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten refusal; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1049", "Quest": "Q00", "Stage": "30", "Topic": "V2_refusal", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "If they threaten us, you judge that danger. I will not call every refusal a threat.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten refusal; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1050", "Quest": "Q00", "Stage": "30", "Topic": "V2_initiates", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Nothing we have established. They have a place here. We should learn what they can do.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten initiates; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1051", "Quest": "Q00", "Stage": "30", "Topic": "V2_initiates", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "My ledger extends the search. It does not erase those who have already arrived.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten initiates; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1052", "Quest": "Q00", "Stage": "30", "Topic": "V2_cheydinhal", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "My Dread Father had other work for me. Work that could not wait.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten cheydinhal; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1053", "Quest": "Q00", "Stage": "30", "Topic": "V2_cheydinhal", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I left. Cicero remained with the Mother. Duty does not spare the people we leave behind.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten cheydinhal; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1054", "Quest": "Q00", "Stage": "30", "Topic": "V2_cheydinhal_tail", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Sad", "Value": "30", "Text": "He has cause to resent me. I will answer him myself when he is willing to hear it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten cheydinhal_tail; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1055", "Quest": "Q00", "Stage": "30", "Topic": "V2_space", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I noticed an illusion over one of the walls. It may conceal a passage.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten space; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1056", "Quest": "Q00", "Stage": "30", "Topic": "V2_space", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "If there are usable chambers beyond it, we could make room. I haven't seen what waits inside.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten space; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1057", "Quest": "Q00", "Stage": "30", "Topic": "V2_proposal_wait", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then we wait. You know what I am offering. Come back when you have an answer.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten proposal_wait; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_030_1058", "Quest": "Q00", "Stage": "30", "Topic": "V2_accept", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then I will bring you leads. You will decide which become invitations.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten accept; Ablauf/Gates in flow.json. Erst nach letzter Response Stage 40. Einstieg fordert alle drei Pflichtblöcke; noch kein Q01-Start."}, {"LineID": "NHV_Q00_030_1059", "Quest": "Q00", "Stage": "30", "Topic": "V2_accept", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "I'll see to the people you bring back. You see to making them worth the trouble.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten accept; Ablauf/Gates in flow.json. Erst nach letzter Response Stage 40. Einstieg fordert alle drei Pflichtblöcke; noch kein Q01-Start."}, {"LineID": "NHV_Q00_030_1060", "Quest": "Q00", "Stage": "30", "Topic": "V2_accept", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "First, let us look for room. There is a concealed passage I would like you to see.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 30", "Notes": "INACTIVE V2; Knoten accept; Ablauf/Gates in flow.json. Erst nach letzter Response Stage 40. Einstieg fordert alle drei Pflichtblöcke; noch kein Q01-Start."}, {"LineID": "NHV_Q00_040_1000", "Quest": "Q00", "Stage": "40", "Topic": "V2_veil", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Here. The stone seems continuous, but the light along this edge does not belong to it.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 40", "Notes": "INACTIVE V2; Knoten veil; Ablauf/Gates in flow.json. Szene A: fünf Phasen. Tür erst nach Veyras letzter Zeile enthüllen; kein erfundener Urheber."}, {"LineID": "NHV_Q00_040_1001", "Quest": "Q00", "Stage": "40", "Topic": "V2_veil", "Speaker": "Nazir", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "I've walked past this wall more times than I care to count.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 40", "Notes": "INACTIVE V2; Kno  in my ledger.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_where; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_060_1028", "Quest": "Q00", "Stage": "60", "Topic": "V2_lead_where", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Follow what you find to Hrefna. Then bring me what you learned. We will decide how to test her.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_where; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_060_1029", "Quest": "Q00", "Stage": "60", "Topic": "V2_lead_silence", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I know she waited through the family's troubles. I cannot tell you what the Mother heard in that time.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_silence; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_060_1030", "Quest": "Q00", "Stage": "60", "Topic": "V2_lead_silence", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Hrefna knows only that no one came. Begin with what that did to her.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_silence; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_060_1031", "Quest": "Q00", "Stage": "60", "Topic": "V2_lead_wait", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Of course. A journey into the marsh deserves at least a dry pair of boots.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_wait; Ablauf/Gates in flow.json. "}, {"LineID": "NHV_Q00_060_1032", "Quest": "Q00", "Stage": "60", "Topic": "V2_lead_accept", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Good. Morthal first, Hakan Reed-Walker, then the farm. I have written down what I know.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 60", "Notes": "INACTIVE V2; Knoten lead_accept; Ablauf/Gates in flow.json. FinishQ00Contract entspricht dem Übergang zu Stage 80; Ledger/Q01 erst beim vorhandenen CompleteQ00-Abschluss."}, {"LineID": "NHV_Q00_080_1000", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Before you go, there is something else I can offer. A witness to my work.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten doubt; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1001", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Someone who knew my work before I came to your door. You might find his account less irritating than mine.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten doubt; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1002", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I could ask him to join us. If you would rather judge me yourself, we can leave it there.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten doubt; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1003", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Call your witness. I would hear what he knows of you.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Auswahl doubt -> summon_accept; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1004", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Your work can speak for you. Give me the ledger.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Auswahl doubt -> doubt_decline; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1005", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Keep your witnesses. I have a candidate to find.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Auswahl doubt -> doubt_sharp; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1006", "Quest": "Q00", "Stage": "80", "Topic": "V2_summon_accept", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then take the ledger. Whatever he tells you, Hrefna still needs finding.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten summon_accept; Ablauf/Gates in flow.json. Am Response-Ende OnDoubtAccepted: vorhandene Reihenfolge CompleteQ00, dann SummonLucien; Q01 startet unabhängig von Lucien-Gespräch.; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1007", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt_decline", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Fairly said. Take it. If you later want to speak with him, ask me.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten doubt_decline; Ablauf/Gates in flow.json. OnDoubtDeclined; Q00 Stage 100 und Q01 starten; späterer Ruf bleibt möglich.; obsolete (E41)"}, {"LineID": "NHV_Q00_080_1008", "Quest": "Q00", "Stage": "80", "Topic": "V2_doubt_sharp", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "Then I will not delay you. The ledger, as promised. May your first report be worth the ink.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 80", "Notes": "INACTIVE V2; Knoten doubt_sharp; Ablauf/Gates in flow.json. Gleicher Abschluss wie höfliche Ablehnung; kein versteckter Malus.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1000", "Quest": "Q00", "Stage": "100", "Topic": "V2_summon", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "An old acquaintance asks a moment of your time. Will you hear her?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten summon; Ablauf/Gates in flow.json. Eigener mod-eigener Lucien-Geist laut bestehendem Brief. Keine frühere Beschwörung durch Spieler voraussetzen; eventuellen Vanilla-Spectral-Assassin vor späterer Aktivierung abgleichen.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1001", "Quest": "Q00", "Stage": "100", "Topic": "V2_summon", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Happy", "Value": "20", "Text": "Veyra. Still keeping such promising company. Lucien Lachance, Listener. I served the family as a Speaker.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten summon; Ablauf/Gates in flow.json. Eigener mod-eigener Lucien-Geist laut bestehendem Brief. Keine frühere Beschwörung durch Spieler voraussetzen; eventuellen Vanilla-Spectral-Assassin vor späterer Aktivierung abgleichen.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1002", "Quest": "Q00", "Stage": "100", "Topic": "V2_summon", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I promised a witness. He was rather less pale when we first met.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten summon; Ablauf/Gates in flow.json. Eigener mod-eigener Lucien-Geist laut bestehendem Brief. Keine frühere Beschwörung durch Spieler voraussetzen; eventuellen Vanilla-Spectral-Assassin vor späterer Aktivierung abgleichen.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1003", "Quest": "Q00", "Stage": "100", "Topic": "V2_summon", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "And you were no more forthcoming. What would you ask of me?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten summon; Ablauf/Gates in flow.json. Eigener mod-eigener Lucien-Geist laut bestehendem Brief. Keine frühere Beschwörung durch Spieler voraussetzen; eventuellen Vanilla-Spectral-Assassin vor späterer Aktivierung abgleichen.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1019", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Lucien Lachance? Your witness is a dead Speaker?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1020", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Veyra, how did you call him here? What sort of power is that?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1004", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You know Veyra's work?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl lucien_hub -> lucien_vouch; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1005", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Would you trust her with the future of this family?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl lucien_hub -> lucien_judgment; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1006", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Tell me what she really is.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl lucien_hub -> lucien_limit; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1007", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_hub", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "I have what I need. Thank you.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl lucien_hub -> end; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1021", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_reveal", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Happy", "Value": "30", "Text": "Death has not ended my service. Nor, apparently, her habit of calling when there is work to be done.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1022", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "I knew whom to ask. He was willing to answer.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1023", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "She called. I answered. There was no chain about my throat.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1024", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "That explains why he answered. Not how you reached him.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1025", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Then let him speak.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1026", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling_secret", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "No. It doesn't.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1027", "Quest": "Q00", "Stage": "100", "Topic": "V2_veyra_calling_secret", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "You asked for someone who knew my work. Must you know all my secrets as well?", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Feinschliff 29.09.2026; Ablauf und Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1008", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_vouch", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "I knew her work in Cheydinhal. She brought names to our attention. Some became useful servants of Sithis.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten lucien_vouch; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1009", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_vouch", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "She understood the difference between finding a killer and choosing a brother. I suggest you remember it as well.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten lucien_vouch; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1010", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_judgment", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "With finding candidates? Yes. With making your decisions? I would trust no one.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten lucien_judgment; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1011", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_judgment", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "She serves Sithis. That is my testimony. What you build with her help remains your responsibility.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten lucien_judgment; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1012", "Quest": "Q00", "Stage": "100", "Topic": "V2_lucien_limit", "Speaker": "Lucien", "VoiceType": "Vanilla", "Emotion": "Neutral", "Value": "30", "Text": "You asked for a witness to her service. I have given you one. Her secrets are hers to surrender.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten lucien_limit; Ablauf/Gates in flow.json. ; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1013", "Quest": "Q00", "Stage": "100", "Topic": "V2_retry", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "You offered to call a witness. I'd like to hear him now.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl retry -> retry_yes; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1014", "Quest": "Q00", "Stage": "100", "Topic": "V2_retry", "Speaker": "Player", "VoiceType": "-", "Emotion": "Neutral", "Value": "50", "Text": "Leave it for now. I still have work to do.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Auswahl retry -> retry_wait; Gates in flow.json.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1015", "Quest": "Q00", "Stage": "100", "Topic": "V2_retry_yes", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "The offer stands. Let us see whether he is willing to join us.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten retry_yes; Ablauf/Gates in flow.json. Nur OnDoubtRetryAccepted, wenn Lucien noch nicht gerufen. Keine erneute Ledger-Vergabe und kein erneuter Q01-Start.; obsolete (E41)"}, {"LineID": "NHV_Q00_100_1016", "Quest": "Q00", "Stage": "100", "Topic": "V2_retry_wait", "Speaker": "Veyra", "VoiceType": "NHV_VoiceVeyra", "Emotion": "Neutral", "Value": "30", "Text": "As you wish. My offer is not going anywhere.", "Conditions": "GetStage NHV_Q00_ShadowAtTheDoor == 100", "Notes": "INACTIVE V2; Knoten retry_wait; Ablauf/Gates in flow.json.; obsolete (E41)"}]}</script><script>

 add(el('content'),'p','Stage '+n.stage+' · '+id,'meta');add(el('content'),'h2',n.title);
 if(n.direction)add(el('content'),'p',n.direction,'note');
 history.push('\n['+n.title+']');
 n.lines.forEach(key=>{const r=rows[key],block=add(el('content'),'div','','speech');add(block,'div',r.Speaker,'speaker');add(block,'span',key,'id');add(block,'p',r.Text);history.push(r.Speaker+': '+r.Text);});
 if(n.pause)add(el('content'),'p','Das Gespräch ist vertagt. Wiederansprechen setzt genau hier fort; keine neue Zustimmung wird angenommen.','note');
 (n.choices||[]).filter(c=>matches(c.requires)).forEach(c=>{const r=rows[c.line];button(r?r.Text:c.ui,()=>{history.push((r?'Player: ':'Regie: ')+(r?r.Text:c.ui));enter(c.to);});});
 if(n.next)button(n.pause?'Veyra / Gruppe erneut ansprechen':'Weiter – nächsten Block / Weltvorgang ansehen',()=>enter(n.next));
 if(n.terminal)add(el('content'),'p','Lesetest abgeschlossen. Im Spiel wäre Q01 jetzt aktiv. Danke fürs Prüfen.','note');
 el('history').textContent=history.join('\n');
}
function reset(){state={...data.flow.initial,cicero:el('cicero').checked,initiates:el('initiates').checked};history=[];enter(data.flow.start);}
el('ids').onchange=()=>document.body.classList.toggle('ids',el('ids').checked);el('reset').onclick=reset;reset();
</script></html>
