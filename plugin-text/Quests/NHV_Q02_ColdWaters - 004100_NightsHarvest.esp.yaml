Name:
  TargetLanguage: English
  Value: Cold Waters
Priority: 90
Type: DarkBrotherhood
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Veyra sent you to identify the hand behind the harbor deaths. Torbjorn's records and the workers' silence point toward the docks.
- Index: 15
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The tidehouse ledger links late shifts, missing names, and Aelius's corrections, but still gives no killer.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A marsh hitch and signs of a struggle offer a place to watch, not a culprit.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Haldor Frost-Knuckle was attacked after dark. Sings-Beneath-Ice fled or led you onward, depending on your intervention.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The trail under the docks leads toward a hidden shore entrance.
- Index: 45
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Haldor's associates are searching the salt yard. Drinks-the-Brine points toward a forgotten sluice.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Sings-Beneath-Ice confessed the drownings. You named Aelius, the harbor clerk, as a test he would never have chosen himself.
- Index: 55
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Aelius's kindness at the harbor is real. That makes the hidden list a harder truth, not an easier one.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: You authorized the test against Aelius. His kindness to the Argonians of the harbor made the choice no easier.
- Index: 70
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Aelius is dead, but his list has not yet explained whether kindness and surveillance were both genuine.
- Index: 100
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Your report must name the actual killer and the decision you made about Sings.
Objectives:
- Index: 10
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Investigate the bodies in Windhelm's harbor.
- Index: 15
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Secure the sealed tidehouse log.
- Index: 20
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Examine the latest victim.
- Index: 30
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Watch the docks at night.
- Index: 40
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Follow the killer without being seen.
- Index: 45
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Cross the salt yard and find the sluice.
- Index: 50
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Confront Sings-Beneath-Ice.
- Index: 55
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Watch Aelius before the trial begins.
- Index: 60
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: "Witness Sings-Beneath-Ice's test: the killing of Aelius."
- Index: 70
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Decide Sings-Beneath-Ice's fate.
- Index: 71
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Stop the courier from sealing Aelius's desk.
- Index: 100
  Flags: []
  DisplayText:
    TargetLanguage: English
    Value: Report the outcome to Veyra.
- Index: 101
