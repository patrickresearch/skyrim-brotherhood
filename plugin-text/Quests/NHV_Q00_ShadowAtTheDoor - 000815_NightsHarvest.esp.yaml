Name:
  TargetLanguage: English
  Value: A Shadow at the Door
Priority: 90
Type: DarkBrotherhood
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A stranger entered the Sanctuary. She spoke of Sithis' call and a new harvest, but had yet to explain what she meant.
- Index: 12
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Before Veyra left the Sanctuary, Lucien Lachance appeared and vouched for her willing service to Sithis.
- Index: 15
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Veyra is waiting at the Windpeak Inn.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Veyra agreed to wait at the Windpeak Inn while you sought the Night Mother's judgment.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The Night Mother permitted Veyra to offer her service. You still had to hear and decide upon her plan.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: You agreed to investigate possible recruits and judge each yourself. Veyra offered to uncover rooms that might house them.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Veyra revealed a doorway. The chambers beyond still needed to be explored and secured.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: You reached the memorial wall. Veyra left Astrid's place among the fallen to your judgment.
- Index: 80
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "You were offered a witness to Veyra's loyalty: Lucien Lachance. Hearing him was your choice."
- Index: 100
  Flags:
  - ShutDownStage
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Find out what became of the one who performed the sacrament.
