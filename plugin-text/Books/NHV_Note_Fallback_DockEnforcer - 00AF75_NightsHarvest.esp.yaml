    <p align="center"><font size="32">TIDEHOUSE AND SALT YARD - WATCH ORDERS</font></p>

    <p align="left">The tidehouse stays shut, and the log does not leave it. Haldor's friends hold the salt yard until his knife turns up.</p>

    <p align="left">Aelius Varro keeps the shift tallies; we keep the dead, and nobody mixes the two. Anyone asking questions is turned around at the door.</p>
