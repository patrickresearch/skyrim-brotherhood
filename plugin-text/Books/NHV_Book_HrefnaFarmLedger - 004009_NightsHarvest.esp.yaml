  Value: >-
    <p align="center"><font size="32">Hrefna Stormhollow's Farm Ledger</font></p>

    <p align="left">Spring: two sacks of barley lost to rain. One axle split. Eirik says the debt has grown teeth.</p>

    <p align="left">Summer: the north field held. My husband did not. He drinks before noon and calls it courage when I ask him to stop.</p>

    [pagebreak]

    <p align="left">Autumn: Eirik marked the west field with red chalk. He says a mark is not a sentence. He has never had to live beneath one.</p>

    <p align="left">Winter: I counted the flour twice. I counted the arrows three times. I did not count the days until I began to fear the answer.</p>
