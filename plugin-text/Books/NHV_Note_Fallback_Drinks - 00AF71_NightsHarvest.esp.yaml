    <p align="center"><font size="32">DRINKS-THE-BRINE - NET TALLY</font></p>

    <p align="left">Knots counted by the dozen, nothing else written. The hitch on the dead men is a marsh hitch, learned where the reeds grow, not on a Nord's boat.</p>

    <p align="left">The old sluice lies behind the salt bins. Haldor's friends watch the yard, so keep low and do not follow the street.</p>
