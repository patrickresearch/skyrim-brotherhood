    <p align="center"><font size="32">Field Note - Hjaalmarch</font></p>

    <p align="left">Locals call Ashmark's death an accident. No witness will speak plainly.</p>

    <p align="left">Hrefna Stormhollow: Nord farmer. Farm seized for debt. Husband reportedly drinking heavily. Defensive when questioned. Do not approach her without a second route out.</p>

    [pagebreak]

    <p align="left">Ritual remains indicate a deliberate petition. No Brotherhood contact confirmed. Watch the farm and question anyone asking after Ashmark.</p>

    <p align="left">If the woman killed Ashmark, she may be useful to the Brotherhood. If she did not, someone else is using the marsh to hide a better story.</p>
