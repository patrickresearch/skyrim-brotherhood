    <p align="center"><font size="32">TORBJORN ICE-VEIN - HARBOR SLATE</font></p>

    <p align="left">Four bodies since the thaw, all Nords, all bound with the same hitch. Complaints are on file against Haldor Frost-Knuckle and his night crew, but a complaint is not a verdict.</p>

    <p align="left">Sergeant Hjorald holds the key to the sealed tidehouse, where the watch log lies. Ask what the night shift saw after the late bell.</p>
