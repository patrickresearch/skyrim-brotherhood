  Value: >-
    <p align="center"><font size="32">Notice of Debt</font></p>

    <p align="left">To Hrefna Stormhollow: payment is overdue. The west field, livestock, tools, and dwelling are collateral against the outstanding sum.</p>

    <p align="left">You have been granted one final extension. Do not mistake patience for mercy. The mark will be made public when the next moon turns.</p>

    [pagebreak]

    <p align="left">Bring the keys to my office in Morthal. Bring your husband if he can stand. Bring no priest, no guard, and no story about bad harvests.</p>

    <p align="left">Eirik Ashmark. This notice will be retained with the account.</p>
