  Value: >-
    <p align="center"><font size="32">Hrefna's Last Words</font></p>

    <p align="left">Six weeks of candles, empty cupboards, and a door that stayed shut.</p>

    <p align="left">Eirik took the farm on paper, so I took his breath in the water.</p>

    <p align="left">I hid the ritual remains because I could bear an empty answer, but not a town laughing at the question.</p>

    <p align="left">The debts broke my husband, and Eirik's hired man broke my daughter. After that, waiting stopped being a virtue.</p>
