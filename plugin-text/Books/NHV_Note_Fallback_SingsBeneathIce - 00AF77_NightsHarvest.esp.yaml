    <p align="center"><font size="32">SINGS-BENEATH-ICE - NAMES ON THE SLATE</font></p>

    <p align="left">A slate scratched with names. Four are crossed out, the warm-bloods who laughed when we were hurt. One is not: Aelius Varro, the harbor clerk, who paid fair and learned our names.</p>

    <p align="left">Beneath it: Fear has been a poor teacher.</p>
