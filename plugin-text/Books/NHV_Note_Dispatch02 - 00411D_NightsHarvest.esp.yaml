  Value: >-
    <p align="center"><font size="32">PENITUS OCULATUS — EASTERN HARBOR</font></p>

    <p align="left">Observe the laborers who move after the bell. Offer fair measure before asking for names. A frightened witness is a door; a grateful one is a key.</p>

    <p align="left">Argonian workers: record shifts, debts, quarrels, and absences. Do not call this persecution. Call it prevention. Forward all patterns to the northern desk under seal.</p>
