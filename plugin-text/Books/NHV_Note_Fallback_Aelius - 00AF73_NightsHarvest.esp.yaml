    <p align="center"><font size="32">A. VARRO - HARBOR CLERK</font></p>

    <p align="left">Argonian net crew to the dry shift; their hands are split to the bone. No man loses pay because a clerk prefers a clean ledger.</p>

    <p align="left">I keep their names so I can send word when a body comes up. Whoever reads my tallies up north reads them closely, and I answer what is asked.</p>
