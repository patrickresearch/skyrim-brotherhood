    <p align="center"><font size="32">NIGHT CREW ROSTER - H. FROST-KNUCKLE</font></p>

    <p align="left">East pier after the late bell: four men on the roster, one short again. Something splashes under the planks most nights, and the lads will not stand at the end of the pier alone.</p>

    <p align="left">Anyone who loses a knife finds me at the salt yard. If the guards ask, the crew saw nothing.</p>
