    <p align="center"><font size="32">Notes from the Moor</font></p>

    <p align="left">Day seven: no answer. Eirik sent another boy to measure the fence. The boy would not meet my eyes.</p>

    <p align="left">Day twenty-one: my husband drank through the morning and slept through the rain. I put the knife away. Then I put it somewhere else.</p>

    [pagebreak]

    <p align="left">Day forty-two: the answer did not come. I found Eirik at the waterline, laughing at the deed in his hand. I asked him to give it back.</p>

    <p align="left">He said the farm was already his. I keep writing that he slipped. I keep crossing it out.</p>

    [pagebreak]

    <p align="left">I washed the cup. Scrubbed the table. There is always something that needs cleaning. It helps until I stop.</p>
