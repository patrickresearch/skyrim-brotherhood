    <p align="center"><font size="32">Scout's Report</font></p>

    <p align="left">To the Penitus Oculatus, Hjaalmarch post.</p>

    <p align="left">Eirik Ashmark drowned near Morthal; his debtor's cellar holds a ritual petition.</p>

    <p align="left">The witness, a woman who prayed, was last seen at a camp beyond the drowned shrine.</p>

    <p align="left">Take her alive. A dead witness answers nothing.</p>
